<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#05070a><title>The Earlywine Blueprint</title><body style="margin:0;background:#05070a;color:#f3ad45;font:700 16px system-ui"><div id=b style="min-height:100vh;display:grid;place-items:center;text-align:center">EARLYWINE BLUEPRINT<br>Loading Pillar Explorer…</div><script>(async()=>{let h=location.hash;try{let a=[];for(let i=1;i<=28;i++){let p='assets/pillar-explorer/p'+String(i).padStart(2,'0')+'.txt',r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+':'+r.status);a.push(await r.text())}let u=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt()),s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip')),x=await new Response(s).text();document.open();document.write(x);document.close();if(h)setTimeout(()=>document.getElementById(decodeURIComponent(h.slice(1)))?.scrollIntoView(),80)}catch(e){b.innerHTML='EARLYWINE BLUEPRINT<br><small>'+e+'</small>'}})()</script>
