*{

}

html{

}

}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

  outline:3px solid var(--yellow);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{

    transition:none !important;
    scroll-behavior:auto !important;
  }
}

}

  border-block:1px solid #000;
}

  height:16px;

}

.shimmer{
  position:relative;
  overflow:hidden;
  background:var(--surface2);
}

.shimmer:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,206,23,.18),transparent);
  animation:shimmer 1s infinite;
}

@keyframes shimmer{
  from{
    transform:translateX(-100%);
  }

  to{
    transform:translateX(100%);
  }
}

.fade-in{

}
