name: Promote canonical V2 payload

on:
  push:
    branches: [canonical-v2-live-promotion-2026-08-31]
    paths:
      - '.deploy/canonical-v2/READY'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          ref: canonical-v2-live-promotion-2026-08-31
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical-v2
          while IFS='|' read -r key target expected count; do
            [ -n "$key" ] || continue
            dir=".deploy/canonical-v2/chunks/$key"
            actual_count=$(find "$dir" -maxdepth 1 -type f -name '*.b64' | wc -l | tr -d ' ')
            test "$actual_count" = "$count"
            cat "$dir"/*.b64 | base64 -d > "/tmp/canonical-v2/$key"
            actual=$(sha256sum "/tmp/canonical-v2/$key" | awk '{print $1}')
            test "$actual" = "$expected"
          done < .deploy/canonical-v2/MANIFEST.tsv

      - name: Guard main against concurrent changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current=$(git rev-parse origin/main)
          expected='f231447749bc8536f1ffa89dd1fb06a270d25f99'
          if [ "$current" != "$expected" ]; then
            echo "main moved: expected $expected, found $current" >&2
            exit 41
          fi

      - name: Build one atomic promotion commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B canonical-v2-promote origin/main
          while IFS='|' read -r key target expected count; do
            [ -n "$key" ] || continue
            mkdir -p "$(dirname "$target")"
            cp "/tmp/canonical-v2/$key" "$target"
          done < .deploy/canonical-v2/MANIFEST.tsv
          git config user.name 'EARLYWINE canonical V2 promotion'
          git config user.email 'lokivelli316@users.noreply.github.com'
          git add index.html gate-closing-build/gate-closing-preview.html rc3-overlay/voting-rights.html assets/canonical-v2
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Promote canonical three-page V2 image-first build'
          git push origin HEAD:main
