<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>White Papers // The Reading Room</title></head><body style="margin:0;background:#050608;color:#e2e8f0;font-family:system-ui,sans-serif"><noscript>This page requires JavaScript to unpack its frozen production artifact.</noscript><div id="boot" style="padding:24px">Loading frozen production surface…</div><script>
(async()=>{
const parts=[
"payload/reading-room-01.b64",
"payload/reading-room-02.b64",
"payload/reading-room-03.b64",
"payload/reading-room-04.b64",
"payload/reading-room-05.b64",
"payload/reading-room-06a.b64",
"payload/reading-room-06b.b64",
"payload/reading-room-07a.b64",
"payload/reading-room-07b.b64",
"payload/reading-room-08a.b64",
"payload/reading-room-08b.b64"
];
const expectedSha256="2567dde473f651ab9d888cf6e888c3a41ed6b22753fee7eeed0efeaf64050cb6";
try{
 const texts=await Promise.all(parts.map(async p=>{
   const r=await fetch(p,{cache:"no-store"});
   if(!r.ok) throw new Error(p+" "+r.status);
   return (await r.text()).trim();
 }));
 const payload=texts.join("");
 const bytes=Uint8Array.from(atob(payload),c=>c.charCodeAt(0));
 const ds=new DecompressionStream("gzip");
 const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
 const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(text));
 const got=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
 if(got!==expectedSha256) throw new Error("frozen payload integrity mismatch");
 const graft='<script data-ew-hamburger-graft src="/EARLYWINE-PRESIDENTIAL-BLUEPRINT/assets/js/hamburger-everywhere.js" defer><\\/script>';
 const out=text.includes("data-ew-hamburger-graft")?text:text.replace(/<\\/body>/i,graft+"</body>");
 document.open();document.write(out);document.close();
}catch(err){
 const boot=document.getElementById("boot");
 if(boot) boot.textContent="Unable to unpack production surface: "+err;
 console.error(err);
}
})();
</script>
